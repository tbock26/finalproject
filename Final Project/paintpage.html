<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic MS Paint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toolbar">
    <label>Color: <input type="color" id="colorPicker" value="#000000"></label>
    <label>Size: <input type="range" id="brushSize" min="1" max="50" value="5"></label>
    <button id="clearBtn">Clear</button>
  </div>

  <canvas id="paintCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');
    const clearBtn = document.getElementById('clearBtn');

    let activePointerId = null;


    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function getCanvasPosition(e) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - bounds.left) * (canvas.width / bounds.width),
        y: (e.clientY - bounds.top) * (canvas.height / bounds.height)
      };
    }

    function startDrawing(e) {
      if (!e.isPrimary || activePointerId !== null) return;
      activePointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      ctx.beginPath();
      const position = getCanvasPosition(e);
      ctx.moveTo(position.x, position.y);
    }

    function draw(e) {
      if (e.pointerId !== activePointerId) return;
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = brushSize.value;
      const position = getCanvasPosition(e);
      ctx.lineTo(position.x, position.y);
      ctx.stroke();
    }

    function stopDrawing(e) {
      if (e.pointerId === activePointerId) {
        activePointerId = null;
      }
    }

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);
    canvas.addEventListener('lostpointercapture', stopDrawing);

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
  </script>

</body>
</html>
